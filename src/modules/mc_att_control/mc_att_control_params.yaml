# Safety defaults:
#   - MC_FUZZY_EN = 0
#   - All base I/D gains and fuzzy gain increments = 0
# Therefore the first SITL build/run keeps the original PX4 attitude P controller.

module_name: mc_att_control

parameters:
  - group: Multicopter Attitude Control
    definitions:
      MC_ROLL_P:
        description:
          short: Roll P gain
          long: >-
            Roll proportional gain, i.e. desired angular speed in rad/s
            for an attitude error of 1 rad.
        type: float
        default: 4.0
        min: 0.0
        max: 12.0
        decimal: 2
        increment: 0.1

      MC_PITCH_P:
        description:
          short: Pitch P gain
          long: >-
            Pitch proportional gain, i.e. desired angular speed in rad/s
            for an attitude error of 1 rad.
        type: float
        default: 4.0
        min: 0.0
        max: 12.0
        decimal: 2
        increment: 0.1

      MC_YAW_P:
        description:
          short: Yaw P gain
          long: >-
            Yaw proportional gain, i.e. desired angular speed in rad/s
            for an attitude error of 1 rad.
        type: float
        default: 2.8
        min: 0.0
        max: 5.0
        decimal: 2
        increment: 0.1

      MC_YAW_WEIGHT:
        description:
          short: Yaw weight
          long: |-
            A fraction from 0 to 1 that deprioritizes yaw relative to roll
            and pitch in the nonlinear attitude controller.

            Multicopters normally have less control authority in yaw than
            in roll and pitch. MC_YAW_P remains the parameter used to tune
            the small-angle yaw response.
        type: float
        default: 0.4
        min: 0.0
        max: 1.0
        decimal: 2
        increment: 0.1

      MC_ROLLRATE_MAX:
        description:
          short: Maximum roll rate
          long: |-
            Roll-rate limit in manual and automatic modes except Acro.
            This limits large attitude commands and helps avoid actuator
            saturation.
        type: float
        default: 220.0
        unit: deg/s
        min: 0.0
        max: 1800.0
        decimal: 1
        increment: 5.0

      MC_PITCHRATE_MAX:
        description:
          short: Maximum pitch rate
          long: |-
            Pitch-rate limit in manual and automatic modes except Acro.
            This limits large attitude commands and helps avoid actuator
            saturation.
        type: float
        default: 220.0
        unit: deg/s
        min: 0.0
        max: 1800.0
        decimal: 1
        increment: 5.0

      MC_YAWRATE_MAX:
        description:
          short: Maximum yaw rate
          long: >-
            Yaw-rate limit in manual and automatic modes except Acro.
        type: float
        default: 200.0
        unit: deg/s
        min: 0.0
        max: 1800.0
        decimal: 1
        increment: 5.0

  - group: Fuzzy PID Attitude Control
    definitions:
      MC_FUZZY_EN:
        description:
          short: Enable Fuzzy PID attitude controller
          long: |-
            Selects the attitude outer-loop control law.

            Disabled uses the original PX4 quaternion proportional
            attitude controller. Enabled uses the Fuzzy PID extension.
        type: enum
        values:
          0: Disabled
          1: Enabled
        default: 0

      MC_FZ_E_MAX:
        description:
          short: Fuzzy attitude-error normalization limit
          long: |-
            Positive limit used to normalize each quaternion attitude-error
            vector component to the fuzzy input range from -1 to 1.
        type: float
        default: 0.5
        min: 0.01
        max: 2.0
        decimal: 3
        increment: 0.01

      MC_FZ_DE_MAX:
        description:
          short: Fuzzy error-rate normalization limit
          long: |-
            Positive angular-rate limit used to normalize the attitude
            error-rate input. The module converts this value from deg/s
            to rad/s before passing it to the controller.
        type: float
        default: 50.0
        unit: deg/s
        min: 1.0
        max: 1000.0
        decimal: 1
        increment: 1.0

      MC_FZ_D_LPF:
        description:
          short: Fuzzy derivative low-pass cutoff
          long: |-
            Cutoff frequency of the first-order low-pass filter applied to
            the derivative input. A value of zero disables filtering.
        type: float
        default: 20.0
        unit: Hz
        min: 0.0
        max: 200.0
        decimal: 1
        increment: 1.0

      MC_FZ_I_LIM:
        description:
          short: Fuzzy integral-state limit
          long: >-
            Symmetric absolute limit applied to the integral state of each
            attitude axis to reduce integral windup.
        type: float
        default: 0.15
        min: 0.0
        max: 2.0
        decimal: 3
        increment: 0.01

      MC_FZ_I_ZONE:
        description:
          short: Fuzzy integration error zone
          long: >-
            Integration is active only while the absolute attitude-error
            component is inside this zone. A value of zero disables normal
            error integration.
        type: float
        default: 0.20
        min: 0.0
        max: 2.0
        decimal: 3
        increment: 0.01

      MC_FZ_R_I:
        description:
          short: Roll base integral gain
          long: >-
            Base Ki value of the Fuzzy PID attitude outer loop for roll.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_P_I:
        description:
          short: Pitch base integral gain
          long: >-
            Base Ki value of the Fuzzy PID attitude outer loop for pitch.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_Y_I:
        description:
          short: Yaw base integral gain
          long: >-
            Base Ki value of the Fuzzy PID attitude outer loop for yaw.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_R_D:
        description:
          short: Roll base derivative gain
          long: >-
            Base Kd value applied to the filtered roll attitude-error rate.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_P_D:
        description:
          short: Pitch base derivative gain
          long: >-
            Base Kd value applied to the filtered pitch attitude-error rate.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_Y_D:
        description:
          short: Yaw base derivative gain
          long: >-
            Base Kd value applied to the filtered yaw attitude-error rate.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_R_DP:
        description:
          short: Roll maximum fuzzy Kp increment
          long: >-
            Maximum positive delta Kp added by fuzzy inference on the roll
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 10.0
        decimal: 3
        increment: 0.01

      MC_FZ_P_DP:
        description:
          short: Pitch maximum fuzzy Kp increment
          long: >-
            Maximum positive delta Kp added by fuzzy inference on the pitch
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 10.0
        decimal: 3
        increment: 0.01

      MC_FZ_Y_DP:
        description:
          short: Yaw maximum fuzzy Kp increment
          long: >-
            Maximum positive delta Kp added by fuzzy inference on the yaw
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 10.0
        decimal: 3
        increment: 0.01

      MC_FZ_R_DI:
        description:
          short: Roll maximum fuzzy Ki increment
          long: >-
            Maximum positive delta Ki added by fuzzy inference on the roll
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_P_DI:
        description:
          short: Pitch maximum fuzzy Ki increment
          long: >-
            Maximum positive delta Ki added by fuzzy inference on the pitch
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_Y_DI:
        description:
          short: Yaw maximum fuzzy Ki increment
          long: >-
            Maximum positive delta Ki added by fuzzy inference on the yaw
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_R_DD:
        description:
          short: Roll maximum fuzzy Kd increment
          long: >-
            Maximum positive delta Kd added by fuzzy inference on the roll
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_P_DD:
        description:
          short: Pitch maximum fuzzy Kd increment
          long: >-
            Maximum positive delta Kd added by fuzzy inference on the pitch
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

      MC_FZ_Y_DD:
        description:
          short: Yaw maximum fuzzy Kd increment
          long: >-
            Maximum positive delta Kd added by fuzzy inference on the yaw
            attitude axis.
        type: float
        default: 0.0
        min: 0.0
        max: 2.0
        decimal: 4
        increment: 0.001

  - group: Multicopter Position Control
    definitions:
      MC_MAN_TILT_TAU:
        description:
          short: Manual tilt input filter time constant
          long: >-
            Setting this parameter to zero disables the manual tilt input
            filter.
        type: float
        default: 0.0
        unit: s
        min: 0.0
        max: 2.0
        decimal: 2
        increment: 0.01
